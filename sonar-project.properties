# SonarQube / SonarScanner configuration (used by GitHub Actions: .github/workflows/sonarqube.yml)
#
# Self-hosted SonarQube Server: set secrets SONAR_TOKEN + SONAR_HOST_URL (or pass them via
# Actions → SonarQube → Run workflow inputs). Create a SonarQube project whose key matches
# sonar.projectKey below (or change this value to match).
#
# SonarCloud instead: add sonar.organization=YOUR_ORG_KEY, set sonar.host.url=https://sonarcloud.io,
# use the SonarCloud GitHub Action, and use a SonarCloud token — see https://docs.sonarsource.com/sonarqube-cloud/

sonar.projectKey=leneord1
sonar.projectName=Personal website

# Only first-party frontend sources — never analyze vendored/venv deps
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Nested CRA scaffold, Python venv, and build output should not be analyzed
sonar.exclusions=**/node_modules/**,**/dist/**,**/chatbot/**,**/coverage/**,**/.vite/**,**/venv/**,**/.venv/**,**/*.test.js,**/*.test.jsx,**/setupTests.js

# Defense in depth if a broader scan is configured on the server
sonar.coverage.exclusions=**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/chatbot/**

# Optional: when you add Vitest coverage (lcov), uncomment:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
